appId: com.workavatar.desktop
productName: WorkAvatar
copyright: Copyright © 2024 WorkAvatar

npmRebuild: false

directories:
  output: release/${version}

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'

asarUnpack:
  - '**/*.node'
  - '**/better_sqlite3/**'

win:
  target:
    - portable
  icon: resources/icons/icon.ico
  signAndEditExecutable: false
  artifactName: '${productName}-Setup-${version}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkAvatar
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
    - zip
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  target:
    - AppImage
    - deb
  icon: resources/icons/icon.png
  category: Office
  executableName: workavatar

publish:
  provider: github
  owner: yourusername
  repo: workavatar
  releaseType: draft

electronDownload:
  mirror: 'https://npmmirror.com/mirrors/electron/'
