appId: com.workavatar.desktop
productName: WorkAvatar
copyright: Copyright © 2024 WorkAvatar

# 注册为 .md 文件关联程序，出现在系统右键"打开方式"菜单
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown 文件
    role: Viewer
    icon: resources/icons/icon.ico
  # 插件分发包：双击 .wap 文件直接用 WorkAvatar 打开并加载插件
  - ext: wap
    name: WorkAvatar 插件包
    description: WorkAvatar 插件包
    role: Editor
    icon: resources/icons/icon.ico

npmRebuild: false

# 日常构建用 normal（快）；正式发布用 npm run build:release 覆盖为 maximum（最小体积、构建慢）
compression: normal

# 仅保留应用实际使用的 Electron 语言包（zh-CN/zh-TW/en-US），其余 ~50 个 .pak 移除
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

afterPack: scripts/afterPack.cjs

directories:
  output: release/${version}

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - build-info.json
  # ── 运行时 node_modules 由 electron-builder 依据 package.json dependencies 自动打包 ──
  #    渲染端库（react/antd/vditor 等）与插件端库（@dbml/@xyflow 等）已移至 devDependencies：
  #    前者由 Vite 打进 dist/，后者由插件构建打进插件自身 dist，均不出现在生产依赖树，
  #    故不再需要大批量的 node_modules 排除规则，既加快 node-module 收集又缩小产物体积。
  # ── 原生模块平台修剪：仅保留当前平台二进制 ──
  - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
  - "!node_modules/sherpa-onnx-darwin-arm64/**"
  - "!node_modules/sherpa-onnx-darwin-x64/**"
  - "!node_modules/sherpa-onnx-linux-x64/**"
  - "!node_modules/sherpa-onnx-linux-arm64/**"
  - "!node_modules/sherpa-onnx-win-ia32/**"
  # ── better-sqlite3：运行时使用预编译 .node，源码（sqlite3.c ~9MB）无需打包 ──
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  # ── plugins 为 git 子模块（含自带 node_modules），打包时整体排除 ──
  - "!plugins/**"
  # ── 全局排除开发时文件模式 ──
  - "!**/*.{d.ts,map}"
  - "!**/{test,tests,__tests__,spec,fixtures,mocks}/**"
  - "!**/README*"
  - "!**/CHANGELOG*"
  - "!**/LICENSE*"
  - "!**/.github/**"
  - "!**/.eslintrc*"
  - "!**/.prettierrc*"
  - "!**/tsconfig*"

extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'
  # 说明：插件不再随主程序打包。开发期由宿主从项目 plugins/ 自动安装到用户目录；
  # 发布期插件经 `node scripts/build-plugins.mjs --zip` 独立打包成 zip，用户在应用内导入。
  # plugin-sdk 为开发期类型源码（主进程 bundle 时已内联），不进生产包。

asarUnpack:
  - '**/*.node'
  - '**/better_sqlite3/**'
  - '**/sqlite-vec-*/**'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  signAndEditExecutable: true
  artifactName: '${productName}-Setup-${version}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkAvatar
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
    - zip
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  target:
    - AppImage
    - deb
  icon: resources/icons/icon.png
  category: Office
  executableName: workavatar

publish:
  provider: github
  owner: yourusername
  repo: workavatar
  releaseType: draft

electronDownload:
  mirror: 'https://npmmirror.com/mirrors/electron/'
