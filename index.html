<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkAvatar 数字员工</title>
    <style>
      /* 小秘书浮窗：窗口是 transparent 的，页面任何不透明底板都会变成黑边 */
      html.wa-secretary-window,
      html.wa-secretary-window body { background: transparent !important; }
      html.wa-secretary-window #boot-splash { display: none !important; }

      /* 启动骨架：React 首帧前先渲染，窗口可立即显示，避免首屏空白的长时间等待 */
      html, body { margin: 0; height: 100%; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #e9eef7;
        color: #565d68;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        transition: opacity 160ms ease;
        -webkit-app-region: drag;
      }
      #boot-splash.is-hidden { opacity: 0; }
      .boot-splash__logo {
        width: 44px;
        height: 44px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.5px;
        color: #f7f8fa;
        background: #16181d;
      }
      .boot-splash__name { font-size: 13px; letter-spacing: 1.4px; font-weight: 600; }
      .boot-splash__bar {
        width: 112px;
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(16, 24, 40, 0.07);
      }
      .boot-splash__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #1677ff;
        animation: boot-splash-move 1.1s ease-in-out infinite;
      }
      @keyframes boot-splash-move {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash { background: #07090d; color: #a7b1c2; }
        .boot-splash__logo { color: #0a0b0d; background: #e8eaed; }
        .boot-splash__bar { background: rgba(255, 255, 255, 0.08); }
        .boot-splash__bar span { background: #4096ff; }
      }
    </style>
  </head>
  <body>
    <script>
      // 透明浮窗必须在首帧前就打上标记：等 React 挂载再改，骨架层会先闪一块不透明底色
      if (location.hash.indexOf('#/secretary/') === 0) {
        document.documentElement.classList.add('wa-secretary-window');
      }
    </script>
    <div id="boot-splash">
      <div class="boot-splash__logo">W</div>
      <div class="boot-splash__name">WorkAvatar</div>
      <div class="boot-splash__bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
